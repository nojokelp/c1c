<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Cambridge C1 Vocabulary Trainer</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@500&display=swap');

  html, body { margin: 0; padding: 0; background: #F8FAFC; }
  #c1app, #c1app * { box-sizing: border-box; }
  #c1app {
    --paper: #F8FAFC;
    --paper-alt: #EEF2FF;
    --card: #FFFFFF;
    --ink: #0F172A;
    --ink-soft: #64748B;
    --ink-faint: #94A3B8;
    --indigo: #4F46E5;
    --indigo-dark: #3730A3;
    --indigo-soft: #EEF2FF;
    --violet: #8B5CF6;
    --violet-soft: #EDE9FE;
    --mint: #2DD4BF;
    --mint-soft: #CCFBF1;
    --mint-text: #0F766E;
    --red: #EF4444;
    --red-soft: #FEE2E2;
    --green: #22C55E;
    --green-soft: #DCFCE7;
    --amber: #8B5CF6;
    --amber-soft: #EDE9FE;
    --border: #E2E8F0;
    --border-soft: #F1F5F9;
    --radius: 8px;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100%;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  #c1app .serif { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  #c1app .mono { font-family: 'IBM Plex Mono', monospace; }

  #c1app a { color: inherit; }
  #c1app button { font-family: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: rgba(79,70,229,0.15); }
  #c1app input, #c1app select, #c1app textarea { font-family: inherit; }

  #c1app .shell { max-width: 880px; margin: 0 auto; padding: 20px 20px 64px; }
  #c1app .shell.narrow { max-width: 620px; }

  #c1app .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px 22px; flex-wrap: wrap; gap: 12px;
    border-bottom: 1px solid var(--border-soft); margin-bottom: 24px;
  }
  #c1app .brand { display: flex; align-items: baseline; gap: 9px; }
  #c1app .brand .mark { font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size: 21px; letter-spacing: -0.01em; }
  #c1app .brand .sub { font-size: 12.5px; color: var(--ink-faint); }
  #c1app nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  #c1app nav.tabs button {
    background: none; border: 1px solid transparent; color: var(--ink-soft);
    font-size: 13.5px; padding: 7px 12px; border-radius: var(--radius);
    transition: background .12s ease, color .12s ease;
  }
  #c1app nav.tabs button:hover { background: var(--paper-alt); color: var(--ink); }
  #c1app nav.tabs button.active { background: var(--indigo); color: #fff; }

  #c1app .exitbar {
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 2px 20px; margin-bottom: 8px;
  }
  #c1app .exitbar .phaselabel { font-size: 13px; color: var(--ink-soft); }
  #c1app .exitbar button.exit {
    background:none; border:1px solid var(--border); color: var(--ink-soft);
    font-size: 12.5px; padding: 6px 11px; border-radius: var(--radius);
  }
  #c1app .exitbar button.exit:hover { border-color: var(--ink-faint); color: var(--ink); }

  #c1app .progressline { height: 4px; background: var(--border-soft); border-radius: 2px; overflow:hidden; margin: 10px 0 26px; }
  #c1app .progressline > div { height: 100%; background: var(--indigo); transition: width .25s ease; }

  #c1app h1.page-title { font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size: 27px; margin: 0 0 4px; letter-spacing:-0.01em; }
  #c1app p.page-sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 22px; }

  #c1app .card {
    background: var(--card); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 22px;
  }
  #c1app .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  #c1app .grid3 { display:grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
  @media (max-width: 640px) {
    #c1app .grid2, #c1app .grid3 { grid-template-columns: 1fr 1fr; }
  }

  #c1app .hero {
    background: linear-gradient(135deg, var(--indigo) 0%, var(--violet) 100%); color: #F8FAFC; border-radius: var(--radius);
    padding: 28px 26px; margin-bottom: 22px; position: relative; overflow:hidden;
  }
  #c1app .hero .heroLabel { font-size: 13px; color: #C7D2FE; margin-bottom: 10px; }
  #c1app .hero .heroNums { display:flex; gap: 34px; margin-bottom: 20px; flex-wrap:wrap; }
  #c1app .hero .heroNum b { font-family:'Plus Jakarta Sans',sans-serif; font-weight: 800; font-size: 32px; display:block; line-height:1; }
  #c1app .hero .heroNum span { font-size: 12.5px; color: #C7D2FE; }
  #c1app .btn {
    display:inline-flex; align-items:center; gap:8px; border-radius: var(--radius);
    padding: 10px 18px; font-size: 14px; font-weight: 600; border: 1px solid transparent;
    transition: opacity .12s ease, transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
  }
  #c1app .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(30,43,54,0.14); }
  #c1app .btn:active:not(:disabled) { transform: translateY(0) scale(.95); box-shadow: 0 2px 4px rgba(30,43,54,0.1); }
  #c1app .btn.primary { background: var(--indigo); color: #fff; }
  #c1app .btn.primary:hover:not(:disabled) { opacity:.95; }
  #c1app .btn.primary:disabled { opacity:.4; cursor:not-allowed; }
  #c1app .btn.ink { background: var(--indigo); color: #fff; }
  #c1app .btn.ink:hover:not(:disabled) { opacity:.95; }
  #c1app .btn.ink:disabled { opacity: .35; cursor: not-allowed; }
  #c1app .btn.ghost { background: transparent; border-color: var(--border); color: var(--ink); }
  #c1app .btn.ghost:hover { border-color: var(--ink-faint); }
  #c1app .btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
  #c1app .btn.danger:hover { background: var(--red-soft); }
  #c1app .btn.block { width: 100%; justify-content:center; }
  #c1app .btn.sm { padding: 6px 12px; font-size: 12.5px; }

  #c1app .stat-box { border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px 16px; background: var(--card); transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease; }
  #c1app .stat-box:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(30,43,54,0.08); }
  #c1app .stat-box .n { font-family:'Plus Jakarta Sans',sans-serif; font-size: 24px; font-weight:600; }
  #c1app .stat-box .l { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  #c1app .section { margin-top: 30px; }
  #c1app .section h2 { font-family:'Plus Jakarta Sans',sans-serif; font-size: 17px; font-weight:600; margin: 0 0 14px; }

  #c1app .tierbar-row { display:flex; align-items:center; gap: 12px; padding: 9px 0; }
  #c1app .tierbar-row .tierlabel { width: 60px; font-size: 13px; font-weight:600; flex-shrink:0; }
  #c1app .tierbar-row .track { flex:1; height: 7px; background: var(--paper-alt); border-radius: 4px; overflow:hidden; }
  #c1app .tierbar-row .fill { height:100%; background: var(--indigo); width: var(--w, 0%); animation: fillBar 1.1s cubic-bezier(.16,1,.3,1) both; }
  #c1app .tierbar-row .pct { width: 42px; text-align:right; font-size: 12.5px; color: var(--ink-soft); flex-shrink:0; }

  #c1app .badge { display:inline-flex; align-items:center; font-size: 11.5px; padding: 3px 8px; border-radius: 4px; font-weight:600; border:1px solid transparent; }
  #c1app .badge.tierS { background: var(--indigo-soft); color: var(--indigo); }
  #c1app .badge.tierA { background: var(--violet-soft); color: var(--violet); }
  #c1app .badge.tierB { background: var(--mint-soft); color: var(--mint-text); }
  #c1app .badge.tierC { background: var(--border-soft); color: var(--ink-soft); }
  #c1app .badge.tierD { background: var(--paper-alt); color: var(--ink-faint); }
  #c1app .badge.score { background: transparent; border-color: var(--border); color: var(--ink-soft); }
  #c1app .badge.status-new { background: var(--paper-alt); color: var(--ink-soft); }
  #c1app .badge.status-learning { background: var(--indigo-soft); color: var(--indigo); }
  #c1app .badge.status-difficult { background: var(--red-soft); color: var(--red); }
  #c1app .badge.status-familiar { background: var(--amber-soft); color: var(--amber); }
  #c1app .badge.status-known { background: var(--green-soft); color: var(--green); }
  #c1app .badge.status-mastered { background: var(--indigo-dark); color: #F8FAFC; }

  #c1app .bigword-wrap { text-align:center; padding: 46px 20px 40px; }
  #c1app .bigword { font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size: 42px; letter-spacing:-0.01em; margin: 6px 0 10px; }
  #c1app .bigmeaning { font-family:'Plus Jakarta Sans',sans-serif; font-size: 30px; color: var(--ink); margin: 6px 0 10px; }
  #c1app .badgerow { display:flex; gap: 8px; justify-content:center; margin-bottom: 6px; flex-wrap:wrap; }
  #c1app .wordtype { font-size: 13px; color: var(--ink-faint); font-style: italic; margin-bottom: 14px; }

  #c1app .detail-block { text-align:left; max-width: 440px; margin: 22px auto 0; font-size: 13.5px; color: var(--ink-soft); }
  #c1app .detail-block .dl { margin-bottom: 10px; }
  #c1app .detail-block .dl b { color: var(--ink); font-weight:600; }
  #c1app .example-box { background: var(--paper-alt); border-left: 3px solid var(--indigo); padding: 10px 14px; border-radius: 3px; margin-top: 16px; font-size: 14px; color: var(--ink); font-style: italic; }

  #c1app .learn-nav { display:flex; justify-content:space-between; align-items:center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-soft); }
  #c1app .dotrow { display:flex; gap: 5px; }
  #c1app .dotrow span { width: 6px; height:6px; border-radius:50%; background: var(--border); }
  #c1app .dotrow span.done { background: var(--indigo); }
  @keyframes dotPop { from { transform: scale(1); } to { transform: scale(1.6); } }
  #c1app .dotrow span.now { background: var(--ink); transform: scale(1.6); animation: dotPop .25s cubic-bezier(.34,1.56,.64,1) both; }

  #c1app .rate-row { display:flex; gap: 10px; justify-content:center; margin-top: 28px; flex-wrap: wrap; }
  #c1app .rate-btn { flex: 1; min-width: 130px; max-width: 190px; border-radius: var(--radius); padding: 13px 10px; border: 1px solid var(--border); background: var(--card); text-align:center; transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s ease; animation: popIn .3s cubic-bezier(.34,1.56,.64,1) both; }
  #c1app .rate-btn:hover { transform: translateY(-3px); }
  #c1app .rate-btn:active { transform: translateY(0) scale(.94); }
  #c1app .rate-row .rate-btn:nth-child(1) { animation-delay: .03s; }
  #c1app .rate-row .rate-btn:nth-child(2) { animation-delay: .09s; }
  #c1app .rate-row .rate-btn:nth-child(3) { animation-delay: .15s; }
  #c1app .rate-btn .k { font-size: 11px; color: var(--ink-faint); display:block; margin-bottom: 4px; }
  #c1app .rate-btn .t { font-size: 13.5px; font-weight:600; }
  #c1app .rate-btn.no { border-color: var(--red); }
  #c1app .rate-btn.no:hover { background: var(--red-soft); }
  #c1app .rate-btn.almost { border-color: var(--amber); }
  #c1app .rate-btn.almost:hover { background: var(--amber-soft); }
  #c1app .rate-btn.yes { border-color: var(--green); }
  #c1app .rate-btn.yes:hover { background: var(--green-soft); }

  #c1app .g2e-input-wrap { max-width: 380px; margin: 0 auto; }
  #c1app .g2e-input {
    width: 100%; padding: 13px 15px; font-size: 19px; font-family:'Plus Jakarta Sans',sans-serif;
    border: 1.5px solid var(--border); border-radius: var(--radius); text-align:center;
    background: var(--card); color: var(--ink);
  }
  #c1app .g2e-input:focus { outline:none; border-color: var(--indigo); }
  #c1app .g2e-input.wrong { border-color: var(--red); animation: shakeX .5s cubic-bezier(.36,.07,.19,.97) both; }
  #c1app .g2e-input.correct { border-color: var(--green); animation: pulseGlow .7s ease-out; }

  #c1app .result-banner { text-align:center; margin-top: 18px; font-size: 15px; font-weight:600; }
  #c1app .result-banner.ok { color: var(--green); animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both; }
  #c1app .result-banner.bad { color: var(--red); animation: shakeX .5s cubic-bezier(.36,.07,.19,.97) both; }
  #c1app .diffbox { max-width: 380px; margin: 14px auto 0; text-align:center; }
  #c1app .diffbox .row { margin-bottom: 8px; font-size: 13px; color: var(--ink-soft); }
  #c1app .diffbox .word { font-family:'Plus Jakarta Sans',sans-serif; font-size: 21px; }
  #c1app .diffbox mark.diffmark { background: var(--red-soft); color: var(--red); border-radius: 2px; padding: 0 1px; }
  #c1app .diffbox .correct-row mark.diffmark { background: var(--green-soft); color: var(--green); }

  #c1app .kbd-hint { text-align:center; font-size: 12px; color: var(--ink-faint); margin-top: 22px; }
  #c1app .kbd-hint kbd { border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; font-family:'IBM Plex Mono',monospace; font-size: 11px; background: var(--paper-alt); }

  #c1app .summary-wrap { text-align:center; padding: 8px 0 0; }
  #c1app .summary-wrap .big { font-family:'Plus Jakarta Sans',sans-serif; font-size: 26px; font-weight:600; margin-bottom: 4px; }
  #c1app .test-grade-badge { width: 84px; height: 84px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 38px; margin: 18px auto 0; animation: bounceIn .7s cubic-bezier(.34,1.56,.64,1) both; }
  #c1app .summary-stats { display:grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin: 26px 0; }
  @media (max-width: 640px) { #c1app .summary-stats { grid-template-columns: repeat(2,1fr); } }
  #c1app .mistake-list { text-align:left; max-width: 380px; margin: 0 auto 24px; }
  #c1app .mistake-list .row { display:flex; justify-content:space-between; padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 14px; }

  #c1app .test-results-list { margin: 26px -22px 0; border-top: 1px solid var(--border-soft); }
  #c1app .test-result-row { padding: 12px 22px; border-bottom: 1px solid var(--border-soft); border-left: 3px solid transparent; animation: fadeSlideUp .35s ease both; }
  #c1app .test-result-row:nth-child(1){animation-delay:.02s} #c1app .test-result-row:nth-child(2){animation-delay:.05s}
  #c1app .test-result-row:nth-child(3){animation-delay:.08s} #c1app .test-result-row:nth-child(4){animation-delay:.11s}
  #c1app .test-result-row:nth-child(5){animation-delay:.14s} #c1app .test-result-row:nth-child(6){animation-delay:.17s}
  #c1app .test-result-row:nth-child(7){animation-delay:.20s} #c1app .test-result-row:nth-child(8){animation-delay:.23s}
  #c1app .test-result-row:nth-child(n+9){animation-delay:.26s}
  #c1app .test-result-row.ok { border-left-color: var(--green); }
  #c1app .test-result-row.bad { border-left-color: var(--red); background: var(--red-soft); }
  #c1app .test-result-row .trr-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  #c1app .test-result-row .trr-german { font-size: 15px; }
  #c1app .test-result-row .trr-mark { font-weight: 700; font-size: 15px; flex-shrink: 0; }
  #c1app .test-result-row.ok .trr-mark { color: var(--green); animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both; animation-delay: inherit; }
  #c1app .test-result-row.bad .trr-mark { color: var(--red); }
  #c1app .test-result-row .trr-bottom { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  #c1app .test-result-row.bad .trr-your { color: var(--red); text-decoration: line-through; text-decoration-color: rgba(169,59,50,0.5); }
  #c1app .test-result-row .trr-correct { color: var(--green); font-weight: 600; }

  #c1app .row-list .item-row {
    display:flex; align-items:center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid var(--border-soft);
    cursor:pointer; touch-action: manipulation; transition: background .12s ease;
    animation: fadeSlideUp .3s ease both;
  }
  #c1app .row-list .item-row:nth-child(1){animation-delay:.01s} #c1app .row-list .item-row:nth-child(2){animation-delay:.03s}
  #c1app .row-list .item-row:nth-child(3){animation-delay:.05s} #c1app .row-list .item-row:nth-child(4){animation-delay:.07s}
  #c1app .row-list .item-row:nth-child(5){animation-delay:.09s} #c1app .row-list .item-row:nth-child(6){animation-delay:.11s}
  #c1app .row-list .item-row:nth-child(7){animation-delay:.13s} #c1app .row-list .item-row:nth-child(n+8){animation-delay:.15s}
  #c1app .row-list .item-row:hover { background: var(--paper-alt); }
  #c1app .row-list .item-row:active { background: var(--indigo-soft); }
  #c1app .row-list .item-row .en { font-family:'Plus Jakarta Sans',sans-serif; font-weight: 600; font-size: 16px; min-width: 150px; }
  #c1app .row-list .item-row .de { color: var(--ink-soft); font-size: 13.5px; flex:1; }
  #c1app .row-list .item-row .meta { display:flex; gap:6px; align-items:center; flex-shrink:0; }

  #c1app .toolbar { display:flex; gap: 10px; flex-wrap:wrap; align-items:center; margin-bottom: 18px; }
  #c1app input.search {
    flex:1; min-width: 180px; padding: 9px 13px; border:1px solid var(--border); border-radius: var(--radius);
    background: var(--card); font-size: 14px; color: var(--ink);
  }
  #c1app input.search:focus { outline:none; border-color: var(--indigo); }
  #c1app .chip {
    font-size: 12.5px; padding: 6px 11px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--card); color: var(--ink-soft);
    transition: transform .16s cubic-bezier(.34,1.56,.64,1), background .12s ease, color .12s ease, border-color .12s ease;
  }
  #c1app .chip:hover { transform: translateY(-1px); }
  #c1app .chip:active { transform: scale(.92); }
  #c1app .chip.on { background: var(--indigo); border-color: var(--indigo); color:#fff; animation: popIn .3s cubic-bezier(.34,1.56,.64,1) both; }

  #c1app .field { margin-bottom: 20px; }
  #c1app .field label { display:block; font-size: 13.5px; font-weight:600; margin-bottom: 6px; }
  #c1app .field .desc { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 8px; }
  #c1app select.ctl, #c1app input.ctl {
    padding: 8px 11px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card); font-size: 13.5px; color: var(--ink); min-width: 160px;
  }
  #c1app .toggle-row { display:flex; align-items:center; justify-content:space-between; padding: 12px 0; border-bottom: 1px solid var(--border-soft); }
  #c1app .toggle-row:last-child { border-bottom:none; }
  #c1app .toggle-row .t { font-size: 13.5px; font-weight:600; }
  #c1app .toggle-row .d { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  #c1app .switch { position:relative; width: 38px; height: 22px; flex-shrink:0; }
  #c1app .switch input { opacity:0; width:0; height:0; }
  #c1app .switch .slider { position:absolute; inset:0; background: var(--border); border-radius: 12px; transition: background .2s ease; }
  #c1app .switch .slider:before { content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  #c1app .switch input:checked + .slider { background: var(--indigo); }
  #c1app .switch input:checked + .slider:before { transform: translateX(16px); }

  #c1app textarea.ctl { width:100%; min-height: 90px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); font-size: 12.5px; font-family:'IBM Plex Mono',monospace; color: var(--ink); resize:vertical; }
  #c1app .msg-box { font-size: 13px; padding: 10px 13px; border-radius: var(--radius); margin-top: 10px; }
  #c1app .msg-box.ok { background: var(--green-soft); color: var(--green); }
  #c1app .msg-box.err { background: var(--red-soft); color: var(--red); }

  #c1app .modal-backdrop { position: fixed; inset:0; background: rgba(20,22,20,.45); display:flex; align-items:flex-start; justify-content:center; padding: 40px 16px; overflow-y:auto; z-index: 50; }
  #c1app .modal { background: var(--card); border-radius: 8px; max-width: 520px; width:100%; padding: 26px; border:1px solid var(--border-soft); }

var STORAGE_KEY = 'cambridge-c1-app-state-v1';
var VOCAB_VERSION = 2; // bump whenever TEST_DATA's word set changes, to auto-migrate saved states

/* ============================= STATE ============================= */
var STATE = null;      // persisted
var UI = { screen: 'loading', session: null, detailId: null, difficultSort: 'mistakes', browserQuery: '', browserFilters: {tier:null, status:null, type:null, tag:null}, importMsg: null, selectedDifficult: {}, confirmDialog: null, testTiers: {S:true, A:true, B:true, C:true, D:true} };
function askConfirm(message, onConfirm){
  UI.confirmDialog = { message: message, onConfirm: onConfirm };
  render();
}
var saveTimer = null;

function defaultState(){
  return {
    items: JSON.parse(JSON.stringify(TEST_DATA)),
    progress: {},
    settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
    dailyStats: {},
    meta: { streakDays: 0, lastActiveDate: null, nextId: TEST_DATA.length + 1, vocabVersion: VOCAB_VERSION }
  };
}

function scheduleSave(){
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ persist(); }, 500);
}
function persist(){
  try {
    window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false).catch(function(){});
  } catch(e){}
}

function loadAndStart(){
  window.storage.get(STORAGE_KEY, false).then(function(res){
    if (res && res.value) {
      try {
        var parsed = JSON.parse(res.value);
        STATE = migrateState(parsed);
      } catch(e){ STATE = defaultState(); }
    } else {
      STATE = defaultState();
    }
    UI.screen = 'dashboard';
    render();
  }).catch(function(){
    STATE = defaultState();
    UI.screen = 'dashboard';
    render();
  });
}
function migrateState(s){
  var d = defaultState();
  if (!s.items) s.items = d.items;
  if (!s.progress) s.progress = {};
  if (!s.settings) s.settings = d.settings;
  else { for (var k in d.settings) if (!(k in s.settings)) s.settings[k] = d.settings[k]; }
  if (!s.dailyStats) s.dailyStats = {};
  if (!s.meta) s.meta = d.meta;
  if (typeof s.meta.nextId !== 'number') {
    var maxId = 0;
    s.items.forEach(function(it){ if (it.id > maxId) maxId = it.id; });
    s.meta.nextId = maxId + 1;
  }
  if (s.meta.vocabVersion !== VOCAB_VERSION){
    // The bundled word list changed since this state was saved - load the new list fresh.
    // Progress against the old (placeholder) word set is no longer meaningful, so it resets too.
    s.items = JSON.parse(JSON.stringify(TEST_DATA));
    s.progress = {};
    s.dailyStats = {};
    s.meta.streakDays = 0;
    s.meta.lastActiveDate = null;
    s.meta.nextId = TEST_DATA.length + 1;
    s.meta.vocabVersion = VOCAB_VERSION;
  }
  return s;
}

/* ============================= UTIL ============================= */
function pad2(n){ return (n<10?'0':'')+n; }
function todayKey(d){ d = d || new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDaysKey(baseKey, n){
  var parts = baseKey.split('-').map(Number);
  var dt = new Date(parts[0], parts[1]-1, parts[2]);
  dt.setDate(dt.getDate()+n);
  return todayKey(dt);
}
function daysBetweenKeys(a,b){
  var pa=a.split('-').map(Number), pb=b.split('-').map(Number);
  var da=new Date(pa[0],pa[1]-1,pa[2]), db=new Date(pb[0],pb[1]-1,pb[2]);
  return Math.round((db-da)/86400000);
}
function fmtDateShort(key){
  if(!key) return '—';
  var p = key.split('-');
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return parseInt(p[2],10)+' '+months[parseInt(p[1],10)-1];
}
function escapeHtml(s){
  s = (s===undefined||s===null) ? '' : String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normalizeAnswer(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function levenshtein(a,b){
  var m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  var prev = []; for(var j=0;j<=n;j++) prev[j]=j;
  for(var i=1;i<=m;i++){
    var cur=[i];
    for(var j2=1;j2<=n;j2++){
      var cost = a[i-1]===b[j2-1] ? 0 : 1;
      cur[j2] = Math.min(prev[j2]+1, cur[j2-1]+1, prev[j2-1]+cost);
    }
    prev = cur;
  }
  return prev[n];
}
function diffParts(correct, user){
  var a=correct, b=user;
  var p=0;
  while(p<a.length && p<b.length && a[p].toLowerCase()===b[p].toLowerCase()) p++;
  var sa=a.length, sb=b.length;
  while(sa>p && sb>p && a[sa-1].toLowerCase()===b[sb-1].toLowerCase()){ sa--; sb--; }
  return {
    correctHtml: escapeHtml(a.slice(0,p)) + (p<sa?'<mark class="diffmark">'+escapeHtml(a.slice(p,sa))+'</mark>':'') + escapeHtml(a.slice(sa)),
    userHtml: escapeHtml(b.slice(0,p)) + (p<sb?'<mark class="diffmark">'+escapeHtml(b.slice(p,sb))+'</mark>':'') + escapeHtml(b.slice(sb))
  };
}
function tierBadgeClass(t){ return 'badge tier'+t; }
function itemById(id){ return STATE.items.find(function(it){ return it.id===id; }); }
function progOf(id){
  if(!STATE.progress[id]){
    STATE.progress[id] = { timesSeen:0, e2gCorrect:0, e2gWrong:0, e2gAlmost:0, g2eCorrect:0, g2eWrong:0, g2eHardWrong:0, g2eTypoWrong:0, spellingMistakes:0, lastReviewAt:null, nextReviewDate:null, level:-1, streak:0, lastAnswers:[] };
  }
  return STATE.progress[id];
}

/* ============================= DOMAIN LOGIC ============================= */
function computeStatus(p){
  if(!p || p.timesSeen===0) return 'new';
  var lastTwo = p.lastAnswers.slice(-2);
  var recentHard = lastTwo.length>0 && lastTwo.every(function(q){ return q===0; });
  var spellRatioBad = p.spellingMistakes>=3 && p.spellingMistakes >= p.timesSeen;
  if (recentHard || spellRatioBad) return 'difficult';
  if (p.level>=5 && p.streak>=3) return 'mastered';
  if (p.level>=3) return 'known';
  if (p.level>=1) return 'familiar';
  return 'learning';
}
function tierRank(t){ return TIER_ORDER.indexOf(t); }

function getNewCandidates(){
  return STATE.items.filter(function(it){
    var p = STATE.progress[it.id];
    return !p || p.timesSeen===0;
  }).sort(function(a,b){
    var tr = tierRank(a.tier)-tierRank(b.tier);
    if (tr!==0) return tr;
    return (b.relevanceScore||0)-(a.relevanceScore||0);
  });
}
function getDueItems(){
  var tk = todayKey();
  return STATE.items.filter(function(it){
    var p = STATE.progress[it.id];
    return p && p.timesSeen>0 && p.nextReviewDate && p.nextReviewDate <= tk;
  }).sort(function(a,b){
    var pa=STATE.progress[a.id], pb=STATE.progress[b.id];
    return (pa.nextReviewDate||'').localeCompare(pb.nextReviewDate||'');
  });
}
function getPracticedWordsForReview(){
  return STATE.items.filter(function(it){
    var p = STATE.progress[it.id];
    return p && p.timesSeen>0;
  }).sort(function(a,b){
    var pa=STATE.progress[a.id], pb=STATE.progress[b.id];
    if (pb.e2gWrong !== pa.e2gWrong) return pb.e2gWrong - pa.e2gWrong;
    var ha=pa.g2eHardWrong||0, hb=pb.g2eHardWrong||0;
    if (hb !== ha) return hb - ha;
    var ta=pa.g2eTypoWrong||0, tb=pb.g2eTypoWrong||0;
    if (tb !== ta) return tb - ta;
    return tierRank(a.tier)-tierRank(b.tier);
  }).map(function(it){ return it.id; });
}
function todaysNewLearnedCount(){
  var tk = todayKey();
  var ds = STATE.dailyStats[tk];
  return ds ? ds.newLearned : 0;
}

function computeNextInterval(level, quality){
  if (quality===0) return {level:-1, days:1};
  if (quality===1){
    var nl = Math.max(level,0);
    return {level: nl, days: INTERVALS_DAYS[Math.min(nl,1)]};
  }
  var nl2 = Math.min(level+1, INTERVALS_DAYS.length-1);
  return {level: nl2, days: INTERVALS_DAYS[nl2]};
}

function ensureDailyStats(){
  var tk = todayKey();
  if (!STATE.dailyStats[tk]) STATE.dailyStats[tk] = {reviewed:0,newLearned:0,correct:0,total:0,spellingCorrect:0,spellingTotal:0,studyTimeSec:0};
  return STATE.dailyStats[tk];
}
function touchStreak(){
  var tk = todayKey();
  if (STATE.meta.lastActiveDate === tk) return;
  if (STATE.meta.lastActiveDate){
    var diff = daysBetweenKeys(STATE.meta.lastActiveDate, tk);
    STATE.meta.streakDays = (diff===1) ? (STATE.meta.streakDays+1) : 1;
  } else {
    STATE.meta.streakDays = 1;
  }
  STATE.meta.lastActiveDate = tk;
}

function finalizeItem(id){
  var res = UI.session.results[id];
  var p = progOf(id);
  var quality;
  if (res.g2eWrong>0) quality = 0;
  else if (res.e2gDidntKnow>0 || res.e2gAlmost>0) quality = 1;
  else quality = 2;

  p.timesSeen += 1;
  p.e2gCorrect += 1;
  p.e2gWrong += res.e2gDidntKnow;
  p.g2eCorrect += 1;
  p.g2eWrong += res.g2eWrong;
  p.g2eHardWrong = (p.g2eHardWrong||0) + (res.g2eHardWrong||0);
  p.g2eTypoWrong = (p.g2eTypoWrong||0) + (res.g2eTypoWrong||0);
  p.spellingMistakes += res.g2eWrong;
  p.lastAnswers.push(quality);
  if (p.lastAnswers.length>5) p.lastAnswers = p.lastAnswers.slice(-5);

  var next = computeNextInterval(p.level, quality);
  p.level = next.level;
  p.nextReviewDate = addDaysKey(todayKey(), next.days);
  p.lastReviewAt = new Date().toISOString();
  p.streak = quality===2 ? (p.streak+1) : 0;

  var ds = ensureDailyStats();
  if (res.isNew) ds.newLearned += 1; else ds.reviewed += 1;
  var totalAttempts = res.e2gDidntKnow + res.e2gAlmost + 1 + res.g2eWrong + 1;
  ds.correct += 2;
  ds.total += totalAttempts;
  ds.spellingCorrect += 1;
  ds.spellingTotal += (res.g2eWrong+1);

  if (quality<2) UI.session.mistakes.push(id);
  scheduleSave();
}

/* ============================= SESSION FLOW ============================= */
function startSession(customIds, opts){
  opts = opts || {};
  touchStreak();
  var newWords, dueWords;
  if (customIds){
    newWords = [];
    dueWords = customIds.slice();
  } else {
    var remaining = Math.max(0, STATE.settings.dailyNewLimit - todaysNewLearnedCount());
    newWords = getNewCandidates().slice(0, Math.min(STATE.settings.newPerSession, remaining)).map(function(it){return it.id;});
    var due = getDueItems();
    if (STATE.settings.reviewsMode==='recommended') due = due.slice(0,30);
    dueWords = due.map(function(it){return it.id;});
  }
  var allIds = newWords.concat(dueWords);
  if (allIds.length===0){ return false; }

  var results = {};
  allIds.forEach(function(id){
    var p = STATE.progress[id];
    results[id] = { isNew: !p || p.timesSeen===0, e2gDidntKnow:0, e2gAlmost:0, g2eWrong:0, g2eHardWrong:0, g2eTypoWrong:0 };
  });

  var g2eOnly = !!opts.g2eOnly || opts.mode==='test';
  UI.session = {
    mode: opts.mode || (g2eOnly ? 'reviewG2E' : 'normal'),
    phase: g2eOnly ? 'g2e' : (newWords.length>0 ? 'learn' : 'e2g'),
    newWords: newWords,
    learnIndex: 0,
    allWordIds: allIds,
    queueE2G: g2eOnly ? [] : allIds.slice(),
    queueG2E: g2eOnly ? allIds.slice() : [],
    currentId: allIds.length>0 ? allIds[0] : null,
    cardRevealed: false,
    g2eStage: 'input',
    g2eInput: '',
    lastCheck: null,
    retypeError: null,
    results: results,
    mistakes: [],
    testTierSelection: opts.testTierSelection || null,
    testAnswers: {},
    pendingConfetti: null,
    testGrade: null,
    startTime: Date.now()
  };
  if (UI.session.phase==='e2g') UI.session.currentId = UI.session.queueE2G[0];
  else if (UI.session.phase==='g2e') UI.session.currentId = UI.session.queueG2E[0];
  UI.screen = 'session';
  return true;
}

function startTestSession(tierSelection){
  var pool = STATE.items.filter(function(it){ return tierSelection[it.tier]; });
  var shuffled = pool.slice();
  for (var i=shuffled.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=shuffled[i]; shuffled[i]=shuffled[j]; shuffled[j]=tmp;
  }
  var ids = shuffled.slice(0,20).map(function(it){ return it.id; });
  if (ids.length===0) return false;
  return startSession(ids, {mode:'test', testTierSelection: Object.assign({}, tierSelection)});
}
function gradeForPct(pct){
  if (pct>=90) return {num:1, label:'Sehr gut'};
  if (pct>=80) return {num:2, label:'Gut'};
  if (pct>=65) return {num:3, label:'Befriedigend'};
  if (pct>=50) return {num:4, label:'Gen\u00fcgend'};
  return {num:5, label:'Nicht gen\u00fcgend'};
}

function e2gDequeue(){
  var s = UI.session;
  if (s.queueE2G.length===0){
    s.phase = 'g2e';
    s.queueG2E = s.allWordIds.slice();
    s.currentId = s.queueG2E.length ? s.queueG2E[0] : null;
    s.g2eStage = 'input'; s.g2eInput=''; s.lastCheck=null; s.retypeError=null;
    if (!s.currentId) finishSession();
    return;
  }
  s.currentId = s.queueE2G[0];
  s.cardRevealed = false;
}
function g2eDequeue(){
  var s = UI.session;
  if (s.queueG2E.length===0){
    finishSession();
    return;
  }
  s.currentId = s.queueG2E[0];
  s.g2eStage = 'input'; s.g2eInput=''; s.lastCheck=null; s.retypeError=null;
}
function finishSession(){
  UI.session.phase = 'summary';
  var ds = ensureDailyStats();
  ds.studyTimeSec += Math.round((Date.now()-UI.session.startTime)/1000);
  if (UI.session.mode==='test'){
    var s = UI.session;
    var correctFirstTry = s.allWordIds.filter(function(id){ return s.results[id].g2eWrong===0; }).length;
    var pct = s.allWordIds.length ? Math.round(100*correctFirstTry/s.allWordIds.length) : 0;
    s.testGrade = gradeForPct(pct);
    s.testPct = pct;
    s.testCorrectCount = correctFirstTry;
    if (s.testGrade.num===1) s.pendingConfetti = {count:130, spread:true};
    else if (s.testGrade.num===2) s.pendingConfetti = {count:75};
    else if (s.testGrade.num===3) s.pendingConfetti = {count:36};
  } else {
    UI.session.pendingConfetti = {count:44};
  }
  scheduleSave();
}

var CONFETTI_COLORS = ['#4F46E5','#8B5CF6','#2DD4BF','#22C55E','#F8FAFC','#EEF2FF'];
function fireConfetti(opts){
  opts = opts || {};
  var count = opts.count || 50;
  var host = document.getElementById('c1app');
  if (!host) return;
  var container = document.createElement('div');
  container.className = 'confetti-burst';
  for (var i=0;i<count;i++){
    var el = document.createElement('span');
    el.className = 'confetti-piece';
    var left = Math.random()*100;
    var delay = Math.random()*0.35;
    var duration = 1.6 + Math.random()*1.4;
    var color = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    var w = 5 + Math.random()*6;
    var hgt = w * (0.35 + Math.random()*0.5);
    var spin = 360 + Math.random()*720;
    var fall = (opts.spread ? 560 : 460) + Math.random()*160;
    el.style.left = left + '%';
    el.style.width = w + 'px';
    el.style.height = hgt + 'px';
    el.style.background = color;
    el.style.setProperty('--spin', spin + 'deg');
    el.style.setProperty('--fall', fall + 'px');
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = delay + 's';
    container.appendChild(el);
  }
  host.appendChild(container);
  setTimeout(function(){ if (container.parentNode) container.parentNode.removeChild(container); }, 3400);
}

function animateCountUp(el, target){
  var duration = 700;
  var startTime = null;
  var raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window) : function(cb){ return setTimeout(function(){ cb(Date.now()); }, 16); };
  function step(ts){
    if (!startTime) startTime = ts;
    var progress = Math.min(1, (ts-startTime)/duration);
    var eased = 1 - Math.pow(1-progress, 3);
    el.textContent = Math.round(target*eased);
    if (progress<1) raf(step);
    else el.textContent = target;
  }
  raf(step);
}
function animateCountUps(){
  var root = document.getElementById('c1app');
  if (!root) return;
  var els = root.querySelectorAll('[data-countup]');
  els.forEach(function(el){
    var target = parseInt(el.getAttribute('data-countup'), 10);
    if (!isNaN(target)) animateCountUp(el, target);
  });
}

function rateE2G(rating){
  var s = UI.session;
  var id = s.currentId;
  s.queueE2G.shift();
  if (rating==='no'){
    s.results[id].e2gDidntKnow += 1;
    s.queueE2G.splice(Math.min(2, s.queueE2G.length), 0, id);
  } else if (rating==='almost'){
    s.results[id].e2gAlmost += 1;
    s.queueE2G.splice(Math.min(4, s.queueE2G.length), 0, id);
  }
  // 'yes' -> item leaves queue for good (e2g phase complete for this item)
  e2gDequeue();
  render();
}

function submitG2E(){
  var s = UI.session;
  var id = s.currentId;
  var item = itemById(id);
  var norm = normalizeAnswer(s.g2eInput);
  var accepted = [item.english].concat(item.acceptedAnswers||[]).map(normalizeAnswer);
  var exact = accepted.indexOf(norm)>=0;
  var correct = exact;
  if (!correct && !STATE.settings.strictSpelling){
    var minDist = Math.min.apply(null, accepted.map(function(a){ return levenshtein(norm,a); }));
    if (minDist<=1 && norm.length>0) correct = true;
  }
  s.lastCheck = { correct: correct, userAnswer: s.g2eInput, correctAnswer: item.english };
  if (correct){
    s.g2eStage = 'result';
  } else {
    s.results[id].g2eWrong += 1;
    var closestDist = norm.length>0 ? Math.min.apply(null, accepted.map(function(a){ return levenshtein(norm,a); })) : 999;
    var wasTypo = closestDist<=2 && norm.length>0;
    if (wasTypo) s.results[id].g2eTypoWrong += 1;
    else s.results[id].g2eHardWrong += 1;
    s.lastCheck.wasTypo = wasTypo;
    s.g2eStage = 'result';
  }
  render();
}
function overrideAsCorrect(){
  var s = UI.session;
  var id = s.currentId;
  var item = itemById(id);
  var given = (s.lastCheck.userAnswer||'').trim();
  var norm = normalizeAnswer(given);
  var alreadyAccepted = [item.english].concat(item.acceptedAnswers||[]).map(normalizeAnswer).indexOf(norm)>=0;
  if (given && !alreadyAccepted){
    item.acceptedAnswers = (item.acceptedAnswers||[]).concat([given]);
  }
  s.results[id].g2eWrong = Math.max(0, s.results[id].g2eWrong-1);
  if (s.lastCheck.wasTypo) s.results[id].g2eTypoWrong = Math.max(0, s.results[id].g2eTypoWrong-1);
  else s.results[id].g2eHardWrong = Math.max(0, s.results[id].g2eHardWrong-1);
  s.lastCheck.correct = true;
  scheduleSave();
  render();
}

function recordTestAnswer(id, userAnswer, correct){
  var s = UI.session;
  var item = itemById(id);
  if (!correct){
    s.results[id].g2eWrong += 1;
    var norm = normalizeAnswer(userAnswer);
    var accepted = [item.english].concat(item.acceptedAnswers||[]).map(normalizeAnswer);
    var closestDist = norm.length>0 ? Math.min.apply(null, accepted.map(function(a){ return levenshtein(norm,a); })) : 999;
    if (closestDist<=2 && norm.length>0) s.results[id].g2eTypoWrong += 1;
    else s.results[id].g2eHardWrong += 1;
  }
  s.testAnswers[id] = { userAnswer: userAnswer, correct: correct, correctAnswer: item.english };
  finalizeItem(id);

  if (s.queueG2E.length===0){

    s.currentId = s.queueG2E[0];

}

function mergeImportedItems(list){
  var added=0, updated=0;
  var byEnglish = {};
  STATE.items.forEach(function(it){ byEnglish[normalizeAnswer(it.english)] = it; });
  list.forEach(function(raw){
    if (!raw || !raw.english) return;
    var key = normalizeAnswer(raw.english);
    var clean = {
      english: String(raw.english),
      german: Array.isArray(raw.german) ? raw.german : (raw.german ? [String(raw.german)] : []),
      acceptedAnswers: Array.isArray(raw.acceptedAnswers) ? raw.acceptedAnswers : (raw.acceptedAnswers ? [String(raw.acceptedAnswers)] : [String(raw.english)]),
      tier: TIER_ORDER.indexOf(raw.tier)>=0 ? raw.tier : 'C',
      relevanceScore: typeof raw.relevanceScore==='number' ? raw.relevanceScore : 50,
      type: raw.type || '',
      tags: Array.isArray(raw.tags) ? raw.tags : [],
      collocations: Array.isArray(raw.collocations) ? raw.collocations : [],
      wordFamily: Array.isArray(raw.wordFamily) ? raw.wordFamily : [],
      example: raw.example || ''
    };
    if (byEnglish[key]){
      var existing = byEnglish[key];
      Object.assign(existing, clean, {id: existing.id});
      updated++;
    } else {
      clean.id = STATE.meta.nextId++;
      STATE.items.push(clean);
      byEnglish[key] = clean;
      added++;
    }
  });
  return {added:added, updated:updated};
}
function parseCSV(text){
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim().length>0; });
  if (lines.length<2) return [];
  var headers = splitCsvLine(lines[0]).map(function(h){ return h.trim(); });
  var out = [];
  for (var i=1;i<lines.length;i++){
    var cells = splitCsvLine(lines[i]);
    var obj = {};
    headers.forEach(function(h,idx){ obj[h] = cells[idx]!==undefined ? cells[idx] : ''; });
    var multi = function(v){ return v ? v.split(';').map(function(x){return x.trim();}).filter(Boolean) : []; };
    out.push({
      english: obj.english,
      german: multi(obj.german),
      acceptedAnswers: multi(obj.acceptedAnswers),
      tier: obj.tier,
      relevanceScore: obj.relevanceScore ? Number(obj.relevanceScore) : undefined,
      type: obj.type,
      tags: multi(obj.tags),
      collocations: multi(obj.collocations),
      wordFamily: multi(obj.wordFamily),
      example: obj.example
    });
  }
  return out;
}
function splitCsvLine(line){
  var res=[], cur='', inQ=false;
  for (var i=0;i<line.length;i++){
    var c=line[i];
    if (c==='"'){
      if (inQ && line[i+1]==='"'){ cur+='"'; i++; } else { inQ=!inQ; }
    } else if (c===',' && !inQ){
      res.push(cur); cur='';
    } else { cur+=c; }
  }
  res.push(cur);
  return res;
}
function handleImportText(text, filenameHint){
  var result = null;
  try {
    var data = JSON.parse(text);
    var list = Array.isArray(data) ? data : (data.items || []);
    result = mergeImportedItems(list);
  } catch(e){
    try {
      var list2 = parseCSV(text);
      result = mergeImportedItems(list2);
    } catch(e2){
      UI.importMsg = {ok:false, text:'Could not parse the file as JSON or CSV.'};
      render();
      return;
    }
  }
  UI.importMsg = {ok:true, text: result.added+' word(s) added, '+result.updated+' updated. Your existing progress was kept.'};
  scheduleSave();
  render();
}
function exportJson(){
  var payload = { items: STATE.items, exportedAt: new Date().toISOString() };
  var blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'cambridge-c1-vocabulary.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

  var strongest=null, weakest=null, bestPct=-1, worstPct=101;
  TIER_ORDER.forEach(function(t){
    var itemsInTier = STATE.items.filter(function(it){ return it.tier===t; });
    if (!itemsInTier.length) return;
    var goodCount = itemsInTier.filter(function(it){ var st=computeStatus(STATE.progress[it.id]); return st==='known'||st==='mastered'; }).length;
    var pct = 100*goodCount/itemsInTier.length;
    if (pct>bestPct){ bestPct=pct; strongest=t; }
    if (pct<worstPct){ worstPct=pct; weakest=t; }
  });

  h += '<div class="section"><h2>Long-term stats</h2><div class="card">';
  h += '<div class="grid3">'+statBox(overallAcc+'%','Overall accuracy')+statBox(overallSpell+'%','Spelling accuracy')+statBox(Math.round(totalStudySec/60)+' min','Total study time')+'</div>';
  h += '<div class="grid2" style="margin-top:16px;">'+
    statBox(strongest?('Tier '+strongest):'—','Strongest tier')+statBox(weakest?('Tier '+weakest):'—','Weakest tier')+'</div>';
  h += '<div class="mini-bars">';
  days.forEach(function(d){
    var h2 = Math.max(2, Math.round(70*d.val/maxVal));
    h += '<div class="col"><div class="bar" style="--h:'+h2+'px" title="'+d.val+'"></div><div class="lbl">'+fmtDateShort(d.key).slice(0,2)+'</div></div>';
  });
  h += '</div></div></div>';

  return h;
}
function statBox(n,l){
  var s = String(n);
  var m = s.match(/^(-?\d+)(.*)$/);
  if (m) {
    return '<div class="stat-box"><div class="n serif"><span class="countup" data-countup="'+m[1]+'">0</span>'+escapeHtml(m[2])+'</div><div class="l">'+escapeHtml(l)+'</div></div>';
  }
  return '<div class="stat-box"><div class="n serif">'+escapeHtml(s)+'</div><div class="l">'+escapeHtml(l)+'</div></div>';
}

function renderSessionShell(){

function renderDifficult(){
  var items = STATE.items.filter(function(it){
    var p = STATE.progress[it.id];
    return p && p.timesSeen>0;
  });
  var sort = UI.difficultSort;
  items = items.filter(function(it){
    var p = STATE.progress[it.id];
    var wrongTotal = p.e2gWrong + p.g2eWrong;
    return wrongTotal>0 || computeStatus(p)==='difficult';
  });
  items.sort(function(a,b){
    var pa=STATE.progress[a.id], pb=STATE.progress[b.id];
    if (sort==='mistakes') return (pb.e2gWrong+pb.g2eWrong)-(pa.e2gWrong+pa.g2eWrong);
    if (sort==='spelling') return pb.spellingMistakes-pa.spellingMistakes;
    if (sort==='accuracy'){
      var accA = (pa.e2gCorrect+pa.g2eCorrect)/Math.max(1,pa.e2gCorrect+pa.e2gWrong+pa.g2eCorrect+pa.g2eWrong);
      var accB = (pb.e2gCorrect+pb.g2eCorrect)/Math.max(1,pb.e2gCorrect+pb.e2gWrong+pb.g2eCorrect+pb.g2eWrong);
      return accA-accB;
    }
    if (sort==='recent') return (pb.lastReviewAt||'').localeCompare(pa.lastReviewAt||'');
    if (sort==='tier') return tierRank(a.tier)-tierRank(b.tier);
    return 0;
  });

  var h = '<h1 class="page-title">Difficult words</h1><p class="page-sub">Words that need extra attention, based on your mistakes.</p>';
  h += '<div class="toolbar">';
  var sorts = [['mistakes','Most mistakes'],['spelling','Spelling mistakes'],['accuracy','Lowest accuracy'],['recent','Recently failed'],['tier','Tier']];
  sorts.forEach(function(pair){
    h += '<button class="chip '+(UI.difficultSort===pair[0]?'on':'')+'" data-sort="'+pair[0]+'">'+pair[1]+'</button>';
  });
  h += '</div>';

  if (items.length===0){
    h += '<div class="empty-state"><div class="em-title serif">No difficult words yet</div>Words you struggle with will show up here automatically.</div>';
    return h;
  }

  h += '<div style="margin-bottom:14px;"><button class="btn primary" id="practice-difficult-btn">Practice all shown ('+items.length+')</button></div>';
  h += '<div class="card row-list">';
  items.forEach(function(it){
    var p = STATE.progress[it.id];
    var acc = Math.round(100*(p.e2gCorrect+p.g2eCorrect)/Math.max(1,p.e2gCorrect+p.e2gWrong+p.g2eCorrect+p.g2eWrong));
    h += '<div class="item-row" data-detail="'+it.id+'">';
    h += '<div class="en">'+escapeHtml(it.english)+'</div>';
    h += '<div class="de">'+escapeHtml((it.german||[]).join('; '))+'</div>';
    h += '<div class="meta"><span class="'+tierBadgeClass(it.tier)+'">'+it.tier+'</span><span style="font-size:12px;color:var(--ink-soft);">'+(p.e2gWrong+p.g2eWrong)+' mistakes &middot; '+acc+'%</span></div>';
    h += '</div>';
  });
  h += '</div>';
  UI.__difficultIds = items.map(function(it){return it.id;});
  return h;
}

  h += '<button class="close-x" id="modal-close">&times;</button>';
  h += '<div class="badgerow" style="justify-content:flex-start;">';
  h += '<span class="'+tierBadgeClass(it.tier)+'">Tier '+it.tier+'</span><span class="badge score">Score '+it.relevanceScore+'</span><span class="badge status-'+st+'">'+st+'</span>';
  h += '</div>';
  h += '<div class="bigword serif" style="font-size:30px;text-align:left;margin-top:12px;">'+escapeHtml(it.english)+'</div>';
  if (it.type) h += '<div class="wordtype" style="text-align:left;">'+escapeHtml(it.type)+'</div>';
  h += '<div class="bigmeaning serif" style="font-size:22px;text-align:left;">'+escapeHtml((it.german||[]).join('; '))+'</div>';
  h += '<div class="detail-block">';
  if (it.collocations && it.collocations.length) h += '<div class="dl"><b>Collocations:</b> '+escapeHtml(it.collocations.join(', '))+'</div>';
  if (it.wordFamily && it.wordFamily.length) h += '<div class="dl"><b>Word family:</b> '+escapeHtml(it.wordFamily.join(', '))+'</div>';
  if (it.tags && it.tags.length) h += '<div class="dl"><b>Tags:</b> '+escapeHtml(it.tags.join(', '))+'</div>';
  if (it.example) h += '<div class="example-box">\u201c'+escapeHtml(it.example)+'\u201d</div>';
  if (p){
    h += '<div class="dl" style="margin-top:16px;"><b>Times seen:</b> '+p.timesSeen+'</div>';
    var e2gAcc = p.e2gCorrect+p.e2gWrong>0 ? Math.round(100*p.e2gCorrect/(p.e2gCorrect+p.e2gWrong)) : null;
    var g2eAcc = p.g2eCorrect+p.g2eWrong>0 ? Math.round(100*p.g2eCorrect/(p.g2eCorrect+p.g2eWrong)) : null;
    if (e2gAcc!==null) h += '<div class="dl"><b>English \u2192 German:</b> '+e2gAcc+'%</div>';
    if (g2eAcc!==null) h += '<div class="dl"><b>German \u2192 English:</b> '+g2eAcc+'%</div>';
    h += '<div class="dl"><b>Spelling mistakes:</b> '+p.spellingMistakes+'</div>';
    h += '<div class="dl"><b>Next review:</b> '+(p.nextReviewDate?fmtDateShort(p.nextReviewDate):'\u2014')+'</div>';
  }
  h += '</div></div></div>';
  return h;
}

/* ============================= RENDER: SETTINGS ============================= */
function renderSettings(){
  var s = STATE.settings;
  var h = '<h1 class="page-title">Settings</h1><p class="page-sub">Tune how new words and reviews are presented.</p>';
  h += '<div class="card">';

  h += '<div class="field"><label>New words per session</label><div class="desc">How many new words appear in the Learn phase of a session.</div>';
  h += '<select class="ctl" id="set-newPerSession">';
  [5,10,15,20,25].forEach(function(n){ h += '<option value="'+n+'" '+(s.newPerSession===n?'selected':'')+'>'+n+'</option>'; });
  h += '</select></div>';

  h += '<div class="field"><label>Daily new word limit</label><div class="desc">Maximum new words introduced per day, across sessions.</div>';
  h += '<select class="ctl" id="set-dailyNewLimit">';
  [10,20,30,40,50].forEach(function(n){ h += '<option value="'+n+'" '+(s.dailyNewLimit===n?'selected':'')+'>'+n+'</option>'; });
  h += '</select></div>';

  h += '<div class="field"><label>Reviews per session</label><div class="desc">Unlimited works through everything due. Recommended caps a session at 30 reviews.</div>';
  h += '<select class="ctl" id="set-reviewsMode">';
  h += '<option value="unlimited" '+(s.reviewsMode==='unlimited'?'selected':'')+'>Unlimited</option>';
  h += '<option value="recommended" '+(s.reviewsMode==='recommended'?'selected':'')+'>Recommended (max 30)</option>';
  h += '</select></div>';

  h += '<div class="toggle-row"><div><div class="t">Strict German \u2192 English spelling</div><div class="d">Off accepts a one-character typo as correct. On (default, recommended) treats any typo as incorrect.</div></div>'+toggle('set-strictSpelling', s.strictSpelling)+'</div>';
  h += '<div class="toggle-row"><div><div class="t">Show example sentences during learning</div></div>'+toggle('set-showExamples', s.showExamples)+'</div>';
  h += '<div class="toggle-row"><div><div class="t">Show tier</div></div>'+toggle('set-showTier', s.showTier)+'</div>';
  h += '<div class="toggle-row"><div><div class="t">Show relevance score</div></div>'+toggle('set-showScore', s.showScore)+'</div>';
  h += '</div>';

  h += '<div class="section"><h2>Vocabulary data</h2><div class="card">';
  h += '<div class="field"><label>Import vocabulary</label><div class="desc">Paste JSON (an array of items, or {"items":[\u2026]}) or CSV with a header row. Existing progress is kept \u2014 matching is done by the English word.</div>';
  h += '<textarea class="ctl" id="import-textarea" placeholder=\'[{"english":"allocate","german":["zuteilen"],"tier":"A","relevanceScore":88}]\'></textarea>';
  h += '<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">';
  h += '<button class="btn ink sm" id="import-text-btn">Import pasted text</button>';
  h += '<label class="btn ghost sm" style="margin:0;">Import file<input type="file" id="import-file" accept=".json,.csv,application/json,text/csv" style="display:none;"></label>';
  h += '<button class="btn ghost sm" id="export-json-btn">Export as JSON</button>';
  h += '</div>';
  if (UI.importMsg) h += '<div class="msg-box '+(UI.importMsg.ok?'ok':'err')+'">'+escapeHtml(UI.importMsg.text)+'</div>';
  h += '</div>';

  h += '<div class="field" style="margin-top:24px;"><label>Reset</label><div class="desc">These actions cannot be undone.</div>';
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap;">';
  h += '<button class="btn danger sm" id="reset-progress-btn">Reset all progress</button>';
  h += '<button class="btn danger sm" id="reset-all-btn">Clear all data</button>';
  h += '</div></div>';
  h += '<div style="text-align:center;margin-top:26px;font-size:11px;color:var(--ink-faint);">Build '+APP_BUILD+'</div>';
  h += '</div></div>';
  return h;
}
function toggle(id, checked){
  return '<label class="switch"><input type="checkbox" id="'+id+'" '+(checked?'checked':'')+'><span class="slider"></span></label>';
}

/* ============================= EVENTS ============================= */
function bindEvents(){
  var root = document.getElementById('c1app');

  root.querySelectorAll('[data-nav]').forEach(function(el){
    el.addEventListener('click', function(){ UI.screen = el.getAttribute('data-nav'); UI.detailId=null; render(); });
  });

  var startBtn = document.getElementById('start-learning-btn');
  if (startBtn) startBtn.addEventListener('click', function(){ if (startSession()) render(); });

  var startReviewBtn = document.getElementById('start-review-btn');
  if (startReviewBtn) startReviewBtn.addEventListener('click', function(){
    var ids = getPracticedWordsForReview();
    if (ids.length && startSession(ids, {g2eOnly:true})) render();
  });

  root.querySelectorAll('[data-test-tier]').forEach(function(el){
    el.addEventListener('click', function(){
      var t = el.getAttribute('data-test-tier');
      UI.testTiers[t] = !UI.testTiers[t];
      render();
    });
  });
  var startTestBtn = document.getElementById('start-test-btn');
  if (startTestBtn) startTestBtn.addEventListener('click', function(){
    if (startTestSession(UI.testTiers)) render();
  });

  // Session: learn phase
  var learnPrev = document.getElementById('learn-prev');
  if (learnPrev) learnPrev.addEventListener('click', function(){ UI.session.learnIndex = Math.max(0, UI.session.learnIndex-1); render(); });
  var learnNext = document.getElementById('learn-next');
  if (learnNext) learnNext.addEventListener('click', function(){ UI.session.learnIndex++; render(); });
  var learnStart = document.getElementById('learn-start-practice');
  if (learnStart) learnStart.addEventListener('click', function(){
    UI.session.phase = 'e2g';
    UI.session.currentId = UI.session.queueE2G[0];
    render();
  });

  // Session: e2g
  var revealBtn = document.getElementById('reveal-answer-btn');
  if (revealBtn) revealBtn.addEventListener('click', function(){ UI.session.cardRevealed = true; render(); });
  root.querySelectorAll('[data-rate]').forEach(function(el){
    el.addEventListener('click', function(){ rateE2G(el.getAttribute('data-rate')); });
  });

  // Session: g2e
  var g2eField = document.getElementById('g2e-field');
  if (g2eField){
    g2eField.addEventListener('input', function(){ UI.session.g2eInput = g2eField.value; });
  }
  var checkBtn = document.getElementById('g2e-check-btn');
  if (checkBtn) checkBtn.addEventListener('click', submitG2E);
  var dontKnowBtn = document.getElementById('g2e-dontknow-btn');
  if (dontKnowBtn) dontKnowBtn.addEventListener('click', dontKnowG2E);
  var contBtn = document.getElementById('g2e-continue-btn');
  if (contBtn) contBtn.addEventListener('click', continueG2E);
  var overrideBtn = document.getElementById('g2e-override-btn');
  if (overrideBtn) overrideBtn.addEventListener('click', overrideAsCorrect);
  var retypeBtn = document.getElementById('g2e-retype-btn');
  if (retypeBtn) retypeBtn.addEventListener('click', submitRetype);
  var retypeSkipBtn = document.getElementById('g2e-retype-skip-btn');
  if (retypeSkipBtn) retypeSkipBtn.addEventListener('click', skipRetype);
  var testNextBtn = document.getElementById('g2e-test-next-btn');
  if (testNextBtn) testNextBtn.addEventListener('click', submitTestAnswer);
  var testSkipBtn = document.getElementById('g2e-test-skip-btn');
  if (testSkipBtn) testSkipBtn.addEventListener('click', skipTestAnswer);

  var exitBtn = document.getElementById('exit-session-btn');
  if (exitBtn) exitBtn.addEventListener('click', function(){
    askConfirm('Exit this session? Progress from words you\u2019ve already completed is saved.', function(){
      UI.session = null; UI.screen='dashboard';
    });
  });

  var practiceMistakesBtn = document.getElementById('practice-mistakes-btn');
  if (practiceMistakesBtn) practiceMistakesBtn.addEventListener('click', function(){
    var ids = Array.from(new Set(UI.session.mistakes));
    var wasG2eOnly = UI.session.mode==='reviewG2E' || UI.session.mode==='test';
    startSession(ids, {g2eOnly: wasG2eOnly}); render();
  });
  var retakeTestBtn = document.getElementById('retake-test-btn');
  if (retakeTestBtn) retakeTestBtn.addEventListener('click', function(){
    var tiers = UI.session.testTierSelection || UI.testTiers;
    if (startTestSession(tiers)) render();
  });
  var backDashBtn = document.getElementById('back-dashboard-btn');
  if (backDashBtn) backDashBtn.addEventListener('click', function(){ UI.session=null; UI.screen='dashboard'; render(); });

  // Difficult
  root.querySelectorAll('[data-sort]').forEach(function(el){
    el.addEventListener('click', function(){ UI.difficultSort = el.getAttribute('data-sort'); render(); });
  });
  var practiceDifficultBtn = document.getElementById('practice-difficult-btn');
  if (practiceDifficultBtn) practiceDifficultBtn.addEventListener('click', function(){
    var ids = UI.__difficultIds || [];
    if (ids.length) { startSession(ids); render(); }
  });

  // Browser
  var searchInput = document.getElementById('browser-search');
  if (searchInput) searchInput.addEventListener('input', function(){ UI.browserQuery = searchInput.value; render(); preserveFocus('browser-search'); });
  root.querySelectorAll('[data-filter]').forEach(function(el){
    el.addEventListener('click', function(){
      var key = el.getAttribute('data-filter'), val = el.getAttribute('data-val');
      UI.browserFilters[key] = (UI.browserFilters[key]===val) ? null : val;
      render();
    });
  });
  var clearFiltersBtn = document.getElementById('clear-filters-btn');
  if (clearFiltersBtn) clearFiltersBtn.addEventListener('click', function(){
    UI.browserFilters = {tier:null,status:null,type:null,tag:null}; UI.browserQuery=''; render();
  });

  // Detail modal
  root.querySelectorAll('[data-detail]').forEach(function(el){
    el.addEventListener('click', function(){ UI.detailId = parseInt(el.getAttribute('data-detail'),10); render(); });
  });
  var modalBackdrop = document.getElementById('modal-backdrop');
  if (modalBackdrop) modalBackdrop.addEventListener('click', function(ev){ if (ev.target===modalBackdrop){ UI.detailId=null; render(); } });
  var modalClose = document.getElementById('modal-close');
  if (modalClose) modalClose.addEventListener('click', function(){ UI.detailId=null; render(); });

  // Settings
  bindSelect('set-newPerSession', function(v){ STATE.settings.newPerSession = parseInt(v,10); scheduleSave(); });
  bindSelect('set-dailyNewLimit', function(v){ STATE.settings.dailyNewLimit = parseInt(v,10); scheduleSave(); });
  bindSelect('set-reviewsMode', function(v){ STATE.settings.reviewsMode = v; scheduleSave(); });
  bindToggle('set-strictSpelling', function(v){ STATE.settings.strictSpelling = v; scheduleSave(); });
  bindToggle('set-showExamples', function(v){ STATE.settings.showExamples = v; scheduleSave(); });
  bindToggle('set-showTier', function(v){ STATE.settings.showTier = v; scheduleSave(); });
  bindToggle('set-showScore', function(v){ STATE.settings.showScore = v; scheduleSave(); });

  var importTextBtn = document.getElementById('import-text-btn');
  if (importTextBtn) importTextBtn.addEventListener('click', function(){
    var ta = document.getElementById('import-textarea');
    if (ta && ta.value.trim()) handleImportText(ta.value, null);
  });
  var importFile = document.getElementById('import-file');
  if (importFile) importFile.addEventListener('change', function(){
    var file = importFile.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){ handleImportText(String(reader.result), file.name); };
    reader.readAsText(file);
  });
  var exportBtn = document.getElementById('export-json-btn');
  if (exportBtn) exportBtn.addEventListener('click', exportJson);

  var resetProgressBtn = document.getElementById('reset-progress-btn');
  if (resetProgressBtn) resetProgressBtn.addEventListener('click', function(){
    askConfirm('Reset all learning progress? Your vocabulary list stays, but every word becomes New again.', function(){
      STATE.progress = {}; STATE.dailyStats = {}; STATE.meta.streakDays=0; STATE.meta.lastActiveDate=null;
      scheduleSave();
    });
  });
  var resetAllBtn = document.getElementById('reset-all-btn');
  if (resetAllBtn) resetAllBtn.addEventListener('click', function(){
    askConfirm('Clear all data and restore the sample vocabulary? This cannot be undone.', function(){
      STATE = defaultState(); scheduleSave();
    });
  });

  var confirmOkBtn = document.getElementById('confirm-ok-btn');
  if (confirmOkBtn) confirmOkBtn.addEventListener('click', function(){
    var cb = UI.confirmDialog && UI.confirmDialog.onConfirm;
    UI.confirmDialog = null;
    if (cb) cb();
    render();
  });
  var confirmCancelBtn = document.getElementById('confirm-cancel-btn');
  if (confirmCancelBtn) confirmCancelBtn.addEventListener('click', function(){ UI.confirmDialog = null; render(); });
  var confirmBackdrop = document.getElementById('confirm-backdrop');
  if (confirmBackdrop) confirmBackdrop.addEventListener('click', function(ev){ if (ev.target===confirmBackdrop){ UI.confirmDialog=null; render(); } });
}
function bindSelect(id, cb){
  var el = document.getElementById(id);
  if (el) el.addEventListener('change', function(){ cb(el.value); });
}
function bindToggle(id, cb){
  var el = document.getElementById(id);
  if (el) el.addEventListener('change', function(){ cb(el.checked); });
}
function preserveFocus(id){
  var el = document.getElementById(id);
  if (el){ el.focus(); var v=el.value; el.value=''; el.value=v; }
}

/* ============================= KEYBOARD SHORTCUTS ============================= */
document.addEventListener('keydown', function(ev){
  if (!UI.session || UI.screen!=='session') return;
  var tag = (ev.target && ev.target.tagName) || '';
  var s = UI.session;
  if (s.phase==='learn'){
    if (ev.key==='ArrowRight' || (ev.key==='Enter' && tag!=='INPUT')){
      ev.preventDefault();
      if (s.learnIndex < s.newWords.length-1){ s.learnIndex++; render(); }
      else { s.phase='e2g'; s.currentId=s.queueE2G[0]; render(); }
    } else if (ev.key==='ArrowLeft'){
      s.learnIndex = Math.max(0,s.learnIndex-1); render();
    }
  } else if (s.phase==='e2g'){
    if (!s.cardRevealed){
      if (ev.key===' '){ ev.preventDefault(); s.cardRevealed=true; render(); }
    } else {
      if (ev.key==='1'){ rateE2G('no'); }
      else if (ev.key==='2'){ rateE2G('almost'); }
      else if (ev.key==='3'){ rateE2G('yes'); }
    }
  } else if (s.phase==='g2e'){
    if (ev.key==='Enter'){
      ev.preventDefault();
      if (s.mode==='test') submitTestAnswer();
      else if (s.g2eStage==='input') submitG2E();
      else if (s.g2eStage==='result') continueG2E();
      else if (s.g2eStage==='retype') submitRetype();
    }
  }
});

/* ============================= BOOT ============================= */
window.C1APP_DEBUG = { getState: function(){ return STATE; }, getUI: function(){ return UI; }, rerender: function(){ render(); } };
loadAndStart();

})();
</script>
